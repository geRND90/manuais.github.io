name: Atualizar README com manuais

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar lista de manuais no README
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          repo = Path(".")
          readme = repo / "README.md"

          inicio = "<!-- MANUAIS:INICIO -->"
          fim = "<!-- MANUAIS:FIM -->"

          # Pastas que não devem aparecer no README
          ignorar = {
              ".git",
              ".github",
          }

          # Nomes personalizados para suas pastas
          nomes_personalizados = {
              "integrJetcom": "Integração MeusCorreios x Jetcommerce",
              "integrShopifyG": "Integração MeusCorreios x Shopify",
              "meuscorreios-chatbot": "Guia de Suporte MeusCorreios Chatbot",
          }

          manuais = []

          for pasta in sorted(repo.iterdir()):
              if not pasta.is_dir():
                  continue

              if pasta.name in ignorar:
                  continue

              # Ignora pastas ocultas
              if pasta.name.startswith("."):
                  continue

              arquivo_manual = None

              # Primeiro procura index.html ou index.htm
              for nome_arquivo in ["index.html", "index.htm"]:
                  caminho = pasta / nome_arquivo
                  if caminho.exists():
                      arquivo_manual = caminho
                      break

              # Se não encontrar index, procura qualquer arquivo .html ou .htm
              if arquivo_manual is None:
                  arquivos_html = sorted([
                      arquivo for arquivo in pasta.iterdir()
                      if arquivo.is_file() and arquivo.suffix.lower() in [".html", ".htm"]
                  ])

                  if not arquivos_html:
                      continue

                  arquivo_manual = arquivos_html[0]

              titulo = nomes_personalizados.get(
                  pasta.name,
                  pasta.name.replace("-", " ").replace("_", " ").title()
              )

              # Se for index.html ou index.htm, o link pode ser direto para a pasta
              if arquivo_manual.name.lower() in ["index.html", "index.htm"]:
                  link = f"./{pasta.name}/"
              else:
                  link = f"./{pasta.name}/{arquivo_manual.name}"

              manuais.append(f"- [{titulo}]({link})")

          nova_lista = "\n".join(manuais)

          conteudo = readme.read_text(encoding="utf-8")

          if inicio not in conteudo or fim not in conteudo:
              raise SystemExit("Marcadores MANUAIS:INICIO e MANUAIS:FIM não encontrados no README.md")

          novo_conteudo = re.sub(
              rf"{re.escape(inicio)}.*?{re.escape(fim)}",
              f"{inicio}\n{nova_lista}\n{fim}",
              conteudo,
              flags=re.S
          )

          readme.write_text(novo_conteudo, encoding="utf-8")
          PY

      - name: Salvar alteração no README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nenhuma alteração no README."
          else
            git add README.md
            git commit -m "Atualiza lista de manuais no README"
            git push
          fi
